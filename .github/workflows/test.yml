name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - run: pip install pyyaml uv
      - name: Run every action with its sample inputs
        run: |
          set -euo pipefail
          for inputs in bentra/modules/*/tests/*.json; do
            module=$(dirname "$(dirname "$inputs")")
            action=$(basename "$inputs" .json)
            echo "::group::$module $action"
            scripts/run-action.sh "$module" "$action" "$inputs"
            echo "::endgroup::"
          done
      - name: The source builds and gives the same result as the committed binary
        working-directory: bentra/modules/sha-tool
        run: |
          set -euo pipefail
          expected=$(printf 'hello bentra' | sha256sum | cut -d' ' -f1)
          make -B build
          cd ../../..
          for binary in committed rebuilt; do
            [[ $binary == committed ]] && git stash -q -- bentra/modules/sha-tool/bin || true
            out=$(scripts/run-action.sh bentra/modules/sha-tool sha256 bentra/modules/sha-tool/tests/sha256.json | tail -2)
            [[ $binary == committed ]] && git stash pop -q || true
            echo "$binary: $out"
            grep -q "$expected" <<<"$out"
          done
